<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>CIRE</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
        <style>
            :root {
                --ink: #1a1714;
                --paper: #f7f4ef;
                --muted: #8a8378;
                --rule: #d4cfc6;
            }

            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid var(--rule);
            }

            .staticrypt-page {
                width: 380px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: var(--paper);
                max-width: 380px;
                margin: 0 auto 100px;
                padding: 48px 40px;
                text-align: center;
                border: 1px solid var(--rule);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-family: 'DM Sans', sans-serif;
                font-size: 14px;
                font-weight: 300;
                outline: 0;
                padding: 14px 30px 14px 15px;
                width: 100%;
                color: var(--ink);
            }

            .staticrypt-input-container {
                position: relative;
                outline: 0;
                background: rgba(255,255,255,0.6);
                width: 100%;
                border: 1px solid var(--rule);
                margin: 0 0 12px;
                box-sizing: border-box;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: rgba(255,255,255,0.6);
                width: 100%;
                border: 1px solid var(--rule);
                margin: 0 0 12px;
                box-sizing: border-box;
            }

            .staticrypt-input-label {
                display: block;
                text-align: left;
                font-family: 'DM Sans', sans-serif;
                font-size: 0.65rem;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 6px;
                font-weight: 400;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: var(--ink);
                width: 100%;
                border: 0;
                padding: 14px;
                color: var(--paper);
                font-family: 'DM Sans', sans-serif;
                font-size: 0.7rem;
                letter-spacing: 0.25em;
                font-weight: 400;
                cursor: pointer;
                margin-top: 8px;
                transition: opacity 0.2s;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                opacity: 0.85;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: var(--ink);
                font-family: 'DM Sans', sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: 1.6em;
                font-weight: 300;
                color: var(--ink);
                margin-bottom: 0.15em;
            }

            .staticrypt-subtitle {
                font-family: 'DM Sans', sans-serif;
                font-size: 0.65rem;
                letter-spacing: 0.3em;
                text-transform: uppercase;
                color: var(--muted);
                font-weight: 400;
            }

            .staticrypt-error-msg {
                color: #8e4a3a;
                font-size: 0.8rem;
                margin-top: -4px;
                margin-bottom: 8px;
                display: none;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                font-family: 'DM Sans', sans-serif;
                font-size: 0.8rem;
                color: var(--muted);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 0.8em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--ink);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--muted);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
