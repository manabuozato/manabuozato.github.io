<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>アマンバグの谷から読む、インドの歴史</title>
<!-- design-source: EXM-0801(Snow Fall) 章扉ピン留め/並走/3層編集 | EXM-0353(Minard) 太さ=量・軸上に複数スレッド統合 | EXM-0400(Cartographies of Time) 時間の堆積・史料敬意+AD介入 | EXM-0809(NYT Jungle Prince) 長尺歴史ノンフィクション -->
<!-- design-rationale: 暖かい近黒#1A1510+金。Snow Fall構造を階層3で借用、冷色黒は史料画由来の暖色に置換。各時代の同時性をMinard統合図で論証化。深さは史実ドロワーで保持 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1A1510;--ink:#ECE3D2;--dim:#A99B83;--gold:#E6B84E;--paper:#F4EEE0;--g:'Zen Kaku Gothic New',sans-serif;--s:'Noto Serif JP',serif;--e:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--s);-webkit-text-size-adjust:100%;line-height:1.95;}
.nav{position:fixed;top:0;right:0;z-index:9;font-family:var(--e);font-size:10.5px;letter-spacing:.12em;color:var(--dim);background:rgba(26,21,16,.72);padding:6px 12px;border-bottom-left-radius:4px;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
.cover{min-height:100svh;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:0 26px 13svh;background-size:cover;background-position:center;}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,21,16,.5) 0%,rgba(26,21,16,.04) 38%,rgba(26,21,16,.93) 100%);}
.cover .in{position:relative;z-index:1;max-width:660px;margin:0 auto;width:100%;}
.cover .ki{font-family:var(--e);font-size:12px;letter-spacing:.34em;color:var(--gold);margin:0 0 14px;}
.cover h1{font-family:var(--s);font-weight:600;font-size:34px;line-height:1.42;letter-spacing:.02em;margin:0 0 12px;text-shadow:0 2px 22px rgba(0,0,0,.6);}
.cover .yr{font-family:var(--s);font-size:16px;color:#D9CDB4;letter-spacing:.08em;}
.sec{max-width:660px;margin:0 auto;padding:11svh 26px;}
.sh{font-family:var(--e);font-size:11px;letter-spacing:.2em;color:var(--gold);margin:0 0 6px;}
.st{font-family:var(--s);font-weight:600;font-size:23px;line-height:1.55;margin:0 0 22px;}
.fig svg{width:100%;height:auto;display:block;}
.cap{font-size:12.5px;color:var(--dim);line-height:1.75;margin:12px 2px 0;font-family:var(--g);}
.lede{font-size:17px;line-height:2;margin:26px 0 0;}
.lede .em{color:var(--gold);font-weight:500;}
.layer{border-top:1px solid #3A3025;padding:16px 0;margin-top:6px;}
.layer .lh{font-family:var(--e);font-size:11px;letter-spacing:.14em;color:var(--dim);margin:0 0 5px;}
.layer p{font-size:15.5px;line-height:1.9;margin:0;}
details{margin-top:6px;}
summary{list-style:none;cursor:pointer;font-family:var(--e);font-size:11px;letter-spacing:.12em;color:var(--gold);padding:4px 0;}
summary::-webkit-details-marker{display:none;}
.drawer{background:var(--paper);color:#2A2218;border-radius:4px;padding:15px 16px;margin-top:8px;font-family:var(--g);}
.drawer .dh{font-family:var(--e);font-size:11px;font-weight:600;letter-spacing:.1em;color:#16324F;margin:0 0 9px;}
.drawer .gl{padding:6px 0;border-top:1px solid #E0D8C6;font-size:13px;line-height:1.68;}
.drawer .gl:first-of-type{border-top:none;}
.drawer .gl b{font-weight:700;}
.drawer .src{font-size:11px;color:#7A7060;border-top:1px dashed #E0D8C6;padding-top:8px;margin-top:7px;}
.end{text-align:center;padding:13svh 26px 18svh;}
.end .q{font-family:var(--s);font-size:21px;line-height:1.95;color:var(--ink);}
.slot{border:1px dashed #4A3E30;border-radius:4px;padding:24px 16px;text-align:center;color:var(--dim);font-family:var(--g);font-size:12.5px;line-height:1.7;margin:18px 0 0;}
.colo{max-width:660px;margin:0 auto;padding:9svh 26px 16svh;border-top:1px solid #3A3025;}
.colo .ch{font-family:var(--e);font-size:11px;letter-spacing:.18em;color:var(--gold);margin:18px 0 6px;}
.colo p{font-size:12.5px;line-height:1.8;color:var(--dim);font-family:var(--g);margin:0;}
@media(min-width:700px){.cover h1{font-size:46px;}.st{font-size:27px;}}
.slot{display:none;}
</style>
</head>

<main id="doc"></main>
<div style="text-align:center;padding:6svh 0 9svh;"><a href="../" style="color:#A99B83;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.14em;text-decoration:none;">← Index</a></div>
<script>
var IMG='amanbagh-img/';
var ERAS=[
 {nav:'序',cover:IMG+'gen/cover.jpg',ki:'PROLOGUE',h:'今夜、あなたはこの谷で眠る。',yr:'その真下に、20億年がある',
  intro:'これから泊まるアマンバグは、ラジャスタン州アルワルのアジャブガル村にある。ジャイプールの市内ではない。別の谷であり、別の物語を持つ。これは、その谷を時間の軸の上に置き直す試み。どの時代でも、この谷とインドと日本に同時に何が起きていたかを、一本の線で見る。降りていこう。'},

 {nav:'第一紀',cover:IMG+'aravalli.jpg',ki:'第一紀　大地',h:'世界でいちばん古い山の、ふところで。',yr:'およそ20億年前',
  scale:true,
  lede:'谷を囲む岩は、20億年を超える。<span class="em">人間が来たのは、ついこのあいだ</span>。',
  tani:'アラヴァリーは、かつてヒマラヤ級だった山が削れた残り。アマンバグはその谷底にある。',
  nihon:'この岩が生まれた頃、日本列島はまだない。最古の岩（岐阜の飛騨片麻岩）も奇しくも約20億年前だが、列島が今の形になるのは約1500万年前。',
  dr:{dh:'大地（先カンブリア時代）',gl:['<b>アラヴァリー山脈</b> 地球で最も古い造山帯のひとつ。先カンブリア時代の岩で、20億年を超える。かつてヒマラヤ級だった高峰がすり減った残りで、いまは標高300〜900mほど。デリーの南からグジャラートまで約670km続く。','<b>野生動物の回廊</b> この山並みはサリスカ保護区とデリー近郊を結ぶ約200kmの回廊で、ヒョウやジャッカルが丘づたいに移動する。'],src:'出典 NASA Earth Observatory・各Wikipedia。年代は推定で幅がある。'}},

 {nav:'第二紀',cover:IMG+'chand-baori.jpg',ki:'第二紀　古代',h:'インダスから、マウリヤ、グプタへ。',yr:'前2600年頃 〜 後6世紀',
  axis:[-2600,600],ticks:[-2600,-250,450],
  lanes:[
   {label:'谷',dots:[]},
   {label:'インド',dots:[{y:-2600,r:4},{y:-250,r:4},{y:450,r:4}]},
   {label:'日本',dots:[{y:-2600,r:3.5},{y:-250,r:3.5},{y:450,r:4}]}],
  lede:'インダス文明が計画都市を営んだ前2600年、<span class="em">日本は縄文時代、貝塚の世</span>だった。',
  tani:'ラジャスタン北部のカーリーバンガンはインダスの街。ジャイプール北のバイラートにはアショーカ王の碑文。教科書の太字が、この州の土に。',
  nihon:'前2600=縄文時代、前3世紀のアショーカ=弥生時代、5世紀のグプタ朝=仁徳陵が築かれた古墳時代。半球の両端で、別々の絶頂。',
  cap:'三千年を一望。インドは文明の連続、日本は縄文から古墳へ。同じ年でなく、同じ「時代の層」を並べる。',
  dr:{dh:'インドの古典文明（山川 第2章1節）',gl:['<b>インダス文明</b>〔鉄板〕 前2600年頃から栄えたインダス川流域の都市文明。モエンジョ＝ダーロなど、整然とした都市計画とまだ解読されない印章で知られる。','<b>アショーカ王</b>〔鉄板〕 前3世紀、マウリヤ朝の王。インドの大部分を統一し、仏教を保護した。各地の岩や石柱に統治の理念（法）を刻ませた。','<b>グプタ朝</b>〔鉄板〕 4〜6世紀の北インドの王朝。ヒンドゥー教やサンスクリット文化が確立し、数学のゼロの概念もこの時代に整った。','<b>この州の現物</b> インダスの街カーリーバンガンはラジャスタン北部にあり、世界最古級の耕作の畝の跡が出た。アショーカ王の碑文はジャイプール県北部のバイラートに残る。'],src:'出典 ブリタニカ・インド考古局（ASI）・各Wikipedia。'}},

 {nav:'第三紀',cover:IMG+'gen/rajput.jpg',ki:'第三紀　ラージプート',h:'ラージプートの世と、森の奥の石。',yr:'8世紀 〜 13世紀',
  axis:[850,1300],ticks:[900,961,1100,1300],
  lanes:[
   {label:'谷',dots:[{y:961,r:6,gold:true}]},
   {label:'インド',band:[850,1050],bandlabel:'プラティーハーラ朝',dots:[{y:961,r:4}]},
   {label:'日本',dots:[{y:905,r:3.5},{y:1008,r:4}]}],
  lede:'ニールカントの石が彫られた961年、<span class="em">日本は平安中期、仮名文字が花ひらいていた</span>。',
  tani:'サリスカの森の奥に、961年のニールカント寺院。プラティーハーラ朝の領主の建立。教科書の五文字が、苔むした石になっている。',
  nihon:'961年は村上天皇の親政（天暦の治）。藤原氏が権力を独占する摂関政治はまだ前夜。古今和歌集に始まる国風文化が育っていた。',
  cap:'谷に一点（ニールカント961）、インドにプラティーハーラ朝の帯、日本に国風文化。同じ時の三つの世界。',
  dr:{dh:'ラージプートの世（山川 第2章末〜4章）',gl:['<b>ラージプート</b>〔頻出〕 7世紀以降に北・中部インドで台頭した武人領主の層。クシャトリヤ（武人階級）を称し、名誉と自治を何より重んじた。一つの民族ではなく、多様な出自の集団が武人化したもの。','<b>ジャウハルとサカ</b> 城が落ちる時、女性は火に身を投じ（ジャウハル）、男はサフラン色の衣で最後の突撃に出た（サカ）。降伏を恥とする気風。','<b>プラティーハーラ朝</b>〔頻出〕 正しくはグルジャラ＝プラティハーラ朝。8〜11世紀の北インドの有力王朝で、西から東進するイスラーム勢力を長く食い止めた。','<b>メーワール</b> ウダイプルの筆頭格。君主だけが「マハーラーナー」を名乗り、婚姻でムガルに従うことを最後まで拒んだ。','<b>ニールカント寺院</b> 961年の碑文を持ち、プラティーハーラ朝の地方領主マタナデーヴァが建てた。マル＝グルジャラ様式。かつて約200の堂宇が並ぶ聖地で、後のアウラングゼーブの破壊を生きのびた。'],src:'出典 各Wikipedia・Incredible India。961年の摂関前夜は研究で確認。'}},

 {nav:'第四紀',cover:IMG+'gen/tarain.jpg',ki:'第四紀　スルタン朝',h:'デリー＝スルタン朝と、抵抗の記憶。',yr:'1192年 〜 16世紀',
  axis:[1150,1350],ticks:[1150,1192,1300,1350],same:{year:1192},
  lanes:[
   {label:'谷',dots:[]},
   {label:'インド',dots:[{y:1192,r:5},{y:1206,r:3.5},{y:1303,r:4}]},
   {label:'日本',dots:[{y:1192,r:5},{y:1281,r:3.5},{y:1333,r:3.5}]}],
  lede:'<span class="em">1192年は、東西で新しい支配体制が同時に生まれた年</span>。',
  tani:'1192年タラーインの戦いでラージプートが敗れ、デリー＝スルタン朝が始まる。1303年チットール包囲。それでもメーワールは屈しない。',
  nihon:'同じ1192年、源頼朝が鎌倉幕府を開いた。武士が公家から実権を切り離す。どちらも正統性の源泉と実力者が別人になった。',
  cap:'金の線が1192年。インドではゴール朝の勝利、日本では鎌倉幕府。遠い二つの転換が、同じ一年に重なる。',
  dr:{dh:'インドのイスラーム化（山川 第4章3節）',gl:['<b>ゴール朝</b>〔頻出〕 12世紀にアフガニスタンから北インドへ侵入したイスラーム王朝。1192年の第2次タラーインの戦いでラージプート連合を破り、イスラーム支配の道を開いた。敗れたのはラージプートの王プリトヴィーラージ3世。','<b>デリー＝スルタン朝</b>〔頻出〕 1206年から約320年、デリーを都にした五つのイスラーム王朝の総称（奴隷王朝からロディー朝まで）。','<b>チットール包囲</b> 1303年、スルタンのアラーウッディーン＝ハルジーがメーワールのチットール城を8か月の包囲の末に攻略した。それでもメーワールは屈服せず、抵抗の象徴であり続けた。'],src:'出典 各Wikipedia。鎌倉幕府は1192年が通説。近年は支配確立を重んじる1185年説もあり、1192年は源頼朝が征夷大将軍に任じられた年。'}},

 {nav:'第五紀',cover:IMG+'gen/akbar-court.jpg',ki:'第五紀　ムガル',h:'谷に城が建った、その同じ年に。',yr:'1556 〜 1605',
  axis:[1550,1620],ticks:[1550,1573,1600,1620],same:{year:1573},
  lanes:[
   {label:'谷',dots:[{y:1573,r:6,gold:true}]},
   {label:'インド',band:[1556,1605],bandlabel:'アクバルの半世紀',dots:[{y:1556,r:3.5},{y:1562,r:3.5},{y:1605,r:3.5}]},
   {label:'日本',band:[1573,1600],bandlabel:'戦国の動乱',dots:[{y:1573,r:4.5},{y:1582,r:3.5},{y:1600,r:3.5}]}],
  lede:'アクバルと織田信長は、<span class="em">ほぼ同世代の征服者</span>だった。バングール城が建った1573年は、信長が足利義昭を京都から追放した年でもある。',
  tani:'アクバルに娘を嫁がせたバールマルの一族が、すぐ隣にバングール城を建てた。教科書の「アクバルのラージプート融和策」は、この谷の石になっている。',
  nihon:'信長が足利義昭を京都から追放し、室町幕府は事実上崩壊した。ただし義昭は殺されず、将軍位を1588年まで保った。やがて本能寺、関ヶ原。その関ヶ原の1600年は、イギリス東インド会社が生まれた年でもある。',
  cap:'太さは「動いていた量」。インドはアクバルの半世紀が分厚く、谷は一点、日本は戦国が荒れる。金の線が1573年。',
  dr:{dh:'アジア諸地域の繁栄（山川 第7章4節）',gl:['<b>アクバル</b>〔鉄板〕 ムガル帝国第3代皇帝（在位1556〜1605）。領土を広げ、ラージプートと融和し、人頭税ジズヤを廃止して、帝国の土台を築いた名君。','<b>ジズヤ</b>〔頻出〕 イスラーム国家が非ムスリム（異教徒）に課した人頭税。アクバルが廃止し、後のアウラングゼーブが復活させた。','<b>マンサブダール制</b>〔頻出〕 ムガルの官僚・軍事制度。位（マンサブ）に応じて給与と、用意すべき騎兵の数が決まる。ラージプートの王もこの位に組み込まれた。','<b>1562年の婚姻</b> アンベールの王バールマルが娘をアクバルに嫁がせた、ムガルとラージプート最初の婚姻同盟。妃は俗にジョーダー＝バーイーと呼ばれるが後世の誤称で、同時代の称号はマリアム＝ウッザマーニー、実名は未確定。','<b>系図　この谷を造った一族（カチワーハー家）</b> バールマル（アンベールの王）。その子バグワント＝ダスが1573年にバングール城を建てる。さらにその子マーン＝シング1世はアクバルの名将として最高位に上り、ハルディーガーティーの戦いでムガル軍を率いた。一族の後裔アジャブ＝シングが1589年にアジャブガル砦を築き、その村がいまのアマンバグ。','<b>アンベール城</b> 同じ一族が1592年からアンベールに築いた、赤砂岩と白大理石の城。鏡細工のシーシュ＝マハルで名高い。'],src:'出典 ブリタニカ・各Wikipedia。信長の義昭追放1573・関ヶ原1600・東インド会社設立1600は通説。系図と来訪伝承は要確認を含む。'}},

 {nav:'第六紀',cover:IMG+'bhangarh.jpg',ki:'第六紀　衰退と廃墟',h:'廃墟と、呪いの真偽。',yr:'1679年 〜 18世紀',
  axis:[1650,1800],ticks:[1650,1707,1783,1800],same:{year:1783},
  lanes:[
   {label:'谷',dots:[{y:1783,r:5,gold:true}]},
   {label:'インド',band:[1658,1707],bandlabel:'アウラングゼーブ',dots:[{y:1679,r:3.5}]},
   {label:'日本',dots:[{y:1688,r:3.5},{y:1783,r:5}]}],
  lede:'バングールを廃墟にした1783年の大飢饉は、<span class="em">浅間山の噴火による天明の大飢饉と同じ年</span>だった。',
  tani:'アウラングゼーブがジズヤを復活させ、帝国の保護が薄れる。バングールの城下町は衰え、決定打は1783年の飢饉。呪いではなく、飢えと水のなさ。',
  nihon:'アウラングゼーブの厳格な治世は、芭蕉や西鶴の元禄文化と同時代。そして1783年、浅間山が噴火し、東北で天明の大飢饉。地球の反対側で、同じ凶年が重なった。',
  cap:'金の線が1783年。谷の飢饉と、日本の天明飢饉。火山が北半球の気温を下げた年に、二つの大地が痩せた。',
  dr:{dh:'衰退（山川 第7章末〜12章）',gl:['<b>アウラングゼーブ</b>〔頻出〕 ムガル第6代皇帝（在位1658〜1707）。領土は最大になったが、イスラーム正統主義を強め、1679年にジズヤを復活させて、ラージプートやマラーターの反発を招いた。','<b>マラーター</b>〔頻出〕 17世紀にデカン高原で台頭したヒンドゥー勢力。シヴァージーが創始し、ムガル衰退後に北インドへ広がった。','<b>バングールの最盛期と廃墟</b> 9000戸とも言われる家々、ジャウハリ＝バザール、いくつものヒンドゥー寺院を抱える城下町だった。決定打は1783年の大飢饉（チャリサ飢饉）。屋根のない廃墟が多いのは、後の人びとが石材や木材を持ち去ったため。','<b>通説　呪いの伝説1</b> 聖者バールー＝ナートが「城の影が庵にかかってはならない」と約束させたが、後の増築で影がかかり、城を呪ったとされる。','<b>通説　呪いの伝説2</b> 魔術師シンギアが王女ラトナーヴァティーに惚れ薬を仕掛けたが見破られ、死に際に城を呪ったとされる。','<b>どこまで確かか</b> 二つの伝説は互いに矛盾し、史料の裏づけもない。考古局の「日没後立入禁止」も幽霊の公認ではなく、野生動物と暗い廃墟の安全のためと複数の解説が指摘する。'],src:'出典 各Wikipedia。天明の大飢饉1782〜88は確実。気候連関と廃村の理由は要確認。'}},

 {nav:'第七紀',cover:IMG+'gen/jaisingh.jpg',ki:'第七紀　谷が国になる',h:'谷が「アルワル」になった日。',yr:'1727年 / 1775年',
  axis:[1700,1820],ticks:[1700,1727,1775,1820],
  lanes:[
   {label:'谷',dots:[{y:1727,r:4},{y:1775,r:5,gold:true}]},
   {label:'インド',band:[1707,1800],bandlabel:'ムガル衰退',dots:[]},
   {label:'日本',dots:[{y:1716,r:3.5},{y:1774,r:4}]}],
  lede:'ジャイ＝シング2世が天文の都を築いた1727年、<span class="em">日本では徳川吉宗の享保の改革</span>。',
  tani:'本家はジャイプールを築き、天文台ジャンタル＝マンタルを建てた。1775年頃、分家ナルカ家がアルワル藩王国を立て、本家から独立する。谷の帰属が「アルワル」と定まる。',
  nihon:'星で統治の正統を示す王と、目安箱で民の声を拾う将軍。アルワル藩王国が立つ1775年は田沼意次の時代で、前年には杉田玄白らの『解体新書』が出ている。',
  cap:'谷に二点（ジャイプール建設・アルワル成立）、日本に享保と田沼。どちらも「秩序を設計し直す」時代だった。',
  dr:{dh:'谷が国になる（教科書外）',gl:['<b>ジャイ＝シング2世</b> アンベール本家の王で天文学者。1727年に平野へ計画都市ジャイプールを築き、石造天文台ジャンタル＝マンタルを造った。ヴリハット＝サムラート＝ヤントラは世界最大級の日時計で、時刻を秒単位で読めるとされる。','<b>サワーイー</b> ジャイ＝シング2世の称号で「1.25倍すぐれた者」の意。ムガル皇帝から贈られたと伝わる。','<b>ハワー＝マハル</b> 1799年に建つ風の宮殿。953の小窓を蜂の巣のように並べ、王室の女性が外から見られずに街の祭りを眺めた。','<b>ピンクシティ</b> 通説では1876年、英皇太子を迎えるために街を塗ったとされる。異説（歴史家ティロットソン）では、それ以前から砂岩の色に近かったとする。','<b>アルワル藩王国（ナルカ家）</b> カチワーハーの分家ナルカ家のプラタップ＝シングが1775年頃に城塞バラ・キラを得て独立し、ジャイプール本家への臣従を断った。アマンバグの谷はこの国の領域。'],src:'出典 各Wikipedia。アルワル建国は1770年説と1775年説がある。要確認。'}},

 {nav:'第八紀',cover:IMG+'gen/eic-treaty.jpg',ki:'第八紀　大英帝国',h:'大英帝国と、最初の握手。',yr:'1757年 〜 1858年',
  axis:[1750,1880],ticks:[1757,1803,1858,1880],same:{year:1858},
  lanes:[

   {label:'日本',dots:[{y:1853,r:3.5},{y:1858,r:5}]}],
  lede:'1858年、<span class="em">インドではムガル帝国が滅び、日本では日米修好通商条約</span>。同じ年、二つのアジアの大国が西洋の論理に組み込まれた。',
  tani:'プラッシーの戦い1757年でイギリスがベンガルを握る。アルワルは1803年、ラジャスタンで最も早く東インド会社と条約を結んだ。間接統治の先頭ランナー。',
  nihon:'ペリーの黒船（1853）の後、1858年に井伊直弼が勅許なしに日米修好通商条約を結び、安政の大獄を断行した。旧来の権威が終わり、新しい秩序が始まる。',
  cap:'金の線が1858年。インドのムガル滅亡と英直轄、日本の開国。同じ年に、二つの古い権威が終わった。',
  dr:{dh:'植民地化（山川 第9章2節・12章2節）',gl:['<b>東インド会社</b>〔鉄板〕 17世紀に英・蘭・仏が設立した特許会社。とくにイギリス東インド会社が、貿易から軍事・徴税へと役割を広げ、インド支配の主体になった。','<b>プラッシーの戦い</b>〔鉄板〕 1757年、イギリス東インド会社がベンガル太守の軍を破った戦い。イギリスのインド支配の起点とされる。1498年のヴァスコ＝ダ＝ガマのインド航路発見から続く流れの末。','<b>藩王国</b>〔頻出〕 イギリスが直接統治せず、現地の王（マハラジャ）を通じて間接に支配した王国。外交権はイギリスが握り、内政は自治。全土で500を超えた。','<b>アルワルの最速の握手</b> アルワルは1803年、ラジャスタンで最も早く東インド会社と条約を結んだ。近くのラスワリの戦いでイギリス側を助けた流れ。間接統治の先頭ランナー。','<b>ムーシーのチャトリ</b> 1815年、第2代マハラジャの死に際し妃ムーシーがサティー（夫の火に殉じる風習）を行い、それを悼んで赤砂岩と白大理石の記念廟が建てられた。'],src:'出典 各Wikipedia。プラッシー1757・ムガル滅亡と英直轄1858・日米修好通商条約1858は確実。'}},

 {nav:'第九紀',cover:IMG+'musi.jpg',ki:'第九紀　近代の藩王',h:'名君と、影。',yr:'1815年 〜 1937年',
  axis:[1830,1950],ticks:[1842,1900,1925,1937],same:{year:1925},

  lede:'農民が撃たれたニームチャナの1925年、<span class="em">日本は同じ年に、普通選挙法と治安維持法をともに成立させた</span>。',
  tani:'建設王ヴィナイ＝シングは1842年に学校を開いた。一方マハラジャ・ジャイ＝シング＝プラバカルは英邁だが苛烈で、1925年のニームチャナ事件では増税に抗議する農民に藩国軍が発砲した。プラバカルは1933年に追放され、1937年パリで客死した。',
  nihon:'1925年の日本は、普通選挙法と治安維持法を同じ年に成立させた。投票箱と監獄を同時に整えたのだ。1937年、盧溝橋事件で日中戦争が全面化する。',
  cap:'金の線が1925年。谷では農民が撃たれ、日本では投票権と治安維持法が同じ年に生まれた。光と影が同居する。',
  dr:{dh:'近代（山川 第12章2節・13章3節）',gl:['<b>インド大反乱（シパーヒーの反乱）</b>〔鉄板〕 1857年、東インド会社のインド人傭兵（シパーヒー）が起こした大反乱。翌1858年にムガル帝国は滅び、イギリス王室の直轄統治に変わった。','<b>インド帝国</b>〔頻出〕 1877年、イギリス女王ヴィクトリアがインド皇帝を兼ねて成立した体制。藩王国もこの傘の下に置かれた。','<b>建設王ヴィナイ＝シング</b> シリセールの湖を造り、1842年に学校を開いて近代教育の先駆けになった。','<b>ジャイ＝シング＝プラバカル</b> マヨー＝カレッジに学んだ英邁な弁論家で、英高官から「最も卓越したインド人」とも評された。一方で苛烈さの逸話も多い（伝承で真偽は不定）。1933年に統治を解かれ、1937年パリで客死した。','<b>ニームチャナ事件</b> 1925年、増税に抗議して集まった農民に藩国軍が発砲し、多くの犠牲を出した。ガンジーはこれを「ジャリヤンワーラー＝バーグより悪い」と非難した。'],src:'出典 各Wikipedia。普通選挙法・治安維持法1925、盧溝橋1937は確実。ニームチャナは1925年。王侯の逸話は伝承で要確認。'}},

 {nav:'第十紀',cover:IMG+'gen/map.jpg',ki:'第十紀　独立と統合',h:'独立、そして谷が州になる。',yr:'1947年 〜 1949年',

  lede:'インド独立（1947年8月15日）と日本国憲法の施行（同年5月3日）は、<span class="em">同じ年。しかも8月15日は、日本の終戦記念日と同じ日付</span>。',
  tani:'アルワルは1948年マツヤ連合へ、1949年にラジャスタン州になる。173年続いた藩王国が役割を終えた。本家ジャイプールのマハラジャは新州の名誉元首に。',
  nihon:'1947年、GHQのもとで日本国憲法が施行され、戦後改革が進む。同じ日が、インドには独立という誕生を、日本には敗戦という喪失を意味した。',

  dr:{dh:'独立（山川 第16章ほか）',gl:['<b>インド独立</b>〔鉄板〕 1947年、イギリスから独立。同時に、地図に散らばっていた500以上の藩王国を新国家インドにどうまとめるかが課題になり、副首相パテルが統合を主導した。','<b>マツヤ連合</b> アルワルは1948年、近隣のバラトプル・ドールプル・カラウリとともに結成した。その名は近くの古代国マツヤに由来し、叙事詩マハーバーラタにも出る古い地名がよみがえった。','<b>谷が州になる</b> 1949年、マツヤ連合は大ラジャスタンに合流し、いまのラジャスタン州ができた。173年続いたアルワル藩王国はここで役割を終える。本家ジャイプールの最後のマハラジャ、マン＝シング2世は新州の名誉元首になった。'],src:'出典 各Wikipedia。インド独立1947年8月15日・日本国憲法施行1947年5月3日は確実。'}},

 {nav:'終章',cover:IMG+'sariska.jpg',ki:'EPILOGUE　終章',h:'そして、あなたの今夜。',yr:'1988年 〜 現在',

function X(s,en,y){var M=42,W=340,R=20;return M+(y-s)/(en-s)*(W-M-R);}
function esc(t){return t;}
function buildScale(){
  // 大地: 20億年スケール（誇張した比例）
  return '<svg viewBox="0 0 340 120" role="img" aria-label="20億年と人類の時間のスケール">'
   +'<rect x="20" y="50" width="300" height="14" rx="7" fill="rgba(201,162,74,.25)"/>'
   +'<text x="22" y="44" font-family="\'Inter\',sans-serif" font-size="10" fill="#A99B83">20億年前</text>'
   +'<rect x="314" y="48" width="6" height="18" fill="#E6B84E"/>'
   +'<text x="318" y="44" text-anchor="end" font-family="\'Zen Kaku Gothic New\',sans-serif" font-size="10.5" fill="#E6B84E">人類</text>'
   +'<text x="170" y="84" text-anchor="middle" font-family="\'Zen Kaku Gothic New\',sans-serif" font-size="11" fill="#A99B83">この帯のほぼ全部が、人のいない時間</text>'
   +'</svg>';
}
function buildFig(e){
  if(e.scale) return buildScale();
  if(!e.axis) return '';
  var s=e.axis[0],en=e.axis[1],laneY=[48,116,180];
  var o='<svg viewBox="0 0 340 232" role="img" aria-label="谷・インド・日本の同時刻">';
  o+='<line x1="42" y1="206" x2="320" y2="206" stroke="#4A3E30" stroke-width="1"/>';
  e.ticks.forEach(function(t){o+='<text x="'+X(s,en,t).toFixed(1)+'" y="220" text-anchor="middle" font-family="\'Inter\',sans-serif" font-size="9" fill="#8C7E68">'+(t<0?('前'+(-t)):t)+'</text>';});
  e.lanes.forEach(function(ln,i){
    var yy=laneY[i];
    o+='<text x="8" y="'+(yy+4)+'" font-family="\'Zen Kaku Gothic New\',sans-serif" font-size="12" font-weight="700" fill="#D9CDB4">'+ln.label+'</text>';
    o+='<line x1="42" y1="'+yy+'" x2="320" y2="'+yy+'" stroke="#3A3025" stroke-width="1"/>';
    if(ln.band){var x1=X(s,en,ln.band[0]),x2=X(s,en,ln.band[1]);
      o+='<rect x="'+x1.toFixed(1)+'" y="'+(yy-11)+'" width="'+(x2-x1).toFixed(1)+'" height="22" rx="11" fill="rgba(201,162,74,.40)"/>';
      if(ln.bandlabel)o+='<text x="'+((x1+x2)/2).toFixed(1)+'" y="'+(yy-15)+'" text-anchor="middle" font-family="\'Zen Kaku Gothic New\',sans-serif" font-size="10" fill="#C9B27A">'+ln.bandlabel+'</text>';
    }
    (ln.dots||[]).forEach(function(d){
      o+='<circle cx="'+X(s,en,d.y).toFixed(1)+'" cy="'+yy+'" r="'+(d.r||4)+'" fill="'+(d.gold?'#E6B84E':'#E8DCC0')+'"/>';
    });
  });
  if(e.same){var xx=X(s,en,e.same.year);
    o+='<line x1="'+xx.toFixed(1)+'" y1="22" x2="'+xx.toFixed(1)+'" y2="192" stroke="#E6B84E" stroke-width="2"/>';
    o+='<rect x="'+(xx-32).toFixed(1)+'" y="6" width="64" height="16" rx="2" fill="#E6B84E"/>';
    o+='<text x="'+xx.toFixed(1)+'" y="18" text-anchor="middle" font-family="\'Zen Kaku Gothic New\',sans-serif" font-size="10.5" font-weight="700" fill="#1A1510">同じ年 '+e.same.year+'</text>';
  }
  return o+'</svg>';
}
function drawer(d){if(!d)return '';var g=d.gl.map(function(x){return '<div class="gl">'+x+'</div>';}).join('');
  return '<details><summary>史実をひらく ＋</summary><div class="drawer"><div class="dh">'+d.dh+'</div>'+g+'<div class="src">'+d.src+'</div></div></details>';}

var html='';
ERAS.forEach(function(e){
  html+='<section class="cover" style="background-image:url('+e.cover+')"><div class="in">'
       +'<p class="ki">'+e.ki+'</p><h1>'+e.h+'</h1><p class="yr">'+e.yr+'</p></div></section>';
  if(e.intro){html+='<section class="sec"><p class="lede">'+e.intro+'</p></section>';return;}
  html+='<section class="sec">';
  if(e.lede)html+='<p class="lede">'+e.lede+'</p>';
  var fig=buildFig(e);
  if(fig)html+='<div class="fig" style="margin-top:24px">'+fig+'</div>'+(e.cap?'<p class="cap">'+e.cap+'</p>':'');
  if(e.tani)html+='<div class="layer"><p class="lh">この谷では</p><p>'+e.tani+'</p></div>';
  if(e.nihon)html+='<div class="layer"><p class="lh">日本では</p><p>'+e.nihon+'</p></div>';
  if(e.dr)html+='<div class="layer">'+drawer(e.dr)+'</div>';
  if(e.slot)html+='<div class="slot">'+e.slot+'</div>';
  if(e.q)html+='<div class="end"><p class="q">'+e.q+'</p></div>';
  html+='</section>';
});
html+='<section class="colo">'
